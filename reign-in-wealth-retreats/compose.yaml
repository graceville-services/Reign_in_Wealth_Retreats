services:
  app:
    build: .
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DEV_PREVIEW_MODE: "false"
      DATABASE_PATH: /app/data/retreats.sqlite
      MEDIA_PATH: /app/data/media
      BACKUP_PATH: /app/backups
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - retreat_data:/app/data
      - retreat_backups:/app/backups
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  retreat_data:
  retreat_backups:
