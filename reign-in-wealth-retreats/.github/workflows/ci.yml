name: Verify retreat website

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      APP_URL: https://retreats.example.com
      DEV_PREVIEW_MODE: "false"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Generate Next.js route types
        run: npm exec next typegen
      - name: Type-check
        run: npm run typecheck
      - name: Test server behavior
        run: npm test
      - name: Build production application
        run: npm run build
